name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:generate
        env:
          CHECKPOINT_DISABLE: '1'
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('backend/coverage/coverage-summary.json') != '' }}
        run: node ../.github/scripts/coverage-summary.mjs Backend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: node ../.github/scripts/coverage-summary.mjs Frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # Browsable HTML coverage for main on GitHub Pages
  # (Settings → Pages → Source: GitHub Actions).
  coverage-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: site
      - name: Build index page
        env:
          SHA: ${{ github.sha }}
        run: |
          total() { node -p "const t = require('./site/coverage-$1/coverage-summary.json').total; ['statements','branches','functions','lines'].map((m) => m + ' ' + t[m].pct + '%').join(' · ')"; }
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Taskly coverage</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}a{font-size:1.2rem}li{margin:1rem 0}</style>
          </head><body>
          <h1>Taskly test coverage</h1>
          <p>main @ <code>${SHA:0:12}</code>, built $(date -u '+%Y-%m-%d %H:%M UTC')</p>
          <ul>
          <li><a href="coverage-backend/index.html">Backend</a><br><small>$(total backend)</small></li>
          <li><a href="coverage-frontend/index.html">Frontend</a><br><small>$(total frontend)</small></li>
          </ul>
          </body></html>
          EOF
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  agent-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
      - name: Unit tests for the agent's guardrails and CI scripts
        run: node --test ".github/agent-tests/tests/*.test.mjs"
